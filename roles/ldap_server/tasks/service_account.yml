---
- name: Create ServiceAccounts organizational unit
  community.general.ldap_entry:
    dn: "ou=ServiceAccounts,{{ ldap_base_dn }}"
    objectClass:
      - organizationalUnit
    attributes:
      ou: ServiceAccounts
    server_uri: "ldap://127.0.0.1"
    bind_dn: "{{ ldap_admin_dn }}"
    bind_pw: "{{ ldap_admin_password }}"

- name: Generate Django LDAP service account password hash
  ansible.builtin.command:
    cmd: "slappasswd -h {SSHA} -s '{{ ldap_service_account.password }}'"
  register: django_bind_password_hash
  no_log: true
  changed_when: false

- name: Create Django LDAP service account
  community.general.ldap_entry:
    dn: "cn={{ ldap_service_account.username }},ou=ServiceAccounts,{{ ldap_base_dn }}"
    objectClass:
      - simpleSecurityObject
      - organizationalRole
    attributes:
      cn: "{{ ldap_service_account.username }}"
      description: "Read-only LDAP bind account for Django"
      userPassword: "{{ django_bind_password_hash.stdout }}"
    server_uri: "ldap://127.0.0.1"
    bind_dn: "{{ ldap_admin_dn }}"
    bind_pw: "{{ ldap_admin_password }}"
  no_log: true
